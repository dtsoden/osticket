; PHP settings for osTicket. The timezone and sendmail path are written at
; startup by the entrypoint into zz-runtime.ini.
expose_php = Off
memory_limit = 256M
upload_max_filesize = 32M
post_max_size = 40M
max_execution_time = 120

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 60

apc.enable_cli = 1
