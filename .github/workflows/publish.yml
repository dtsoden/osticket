name: Publish image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - docker/**
      - .github/workflows/publish.yml
  pull_request:
  # Weekly check for security fixes in the PHP base image. It only rebuilds
  # when the base image has changed since the last published build.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read osTicket version from Dockerfile
        id: version
        run: |
          version=$(sed -n 's/^ARG OSTICKET_VERSION=//p' Dockerfile)
          test -n "$version"
          echo "osticket=$version" >> "$GITHUB_OUTPUT"

      - name: Check whether the PHP base image changed
        id: base
        env:
          VERSION: ${{ steps.version.outputs.osticket }}
        run: |
          base=$(sed -n 's/^FROM //p' Dockerfile | head -1)
          digest=$(docker buildx imagetools inspect "$base" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            published=$(docker buildx imagetools inspect "ghcr.io/${GITHUB_REPOSITORY_OWNER}/osticket:${VERSION}" \
              --format '{{json .Image}}' 2>/dev/null \
              | jq -r '."linux/amd64".config.Labels["org.opencontainers.image.base.digest"] // empty' || true)
            if [ "$published" = "$digest" ]; then
              echo "::notice::$base is unchanged since the last build, nothing to do"
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - uses: docker/setup-qemu-action@v4
        if: steps.base.outputs.skip != 'true'
      - uses: docker/setup-buildx-action@v4
        if: steps.base.outputs.skip != 'true'

      - name: Log in to GitHub Container Registry
        if: steps.base.outputs.skip != 'true' && github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        if: steps.base.outputs.skip != 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/osticket
          tags: |
            type=raw,value=${{ steps.version.outputs.osticket }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=osTicket
            org.opencontainers.image.version=${{ steps.version.outputs.osticket }}
            org.opencontainers.image.base.digest=${{ steps.base.outputs.digest }}

      - uses: docker/build-push-action@v7
        if: steps.base.outputs.skip != 'true'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create the GitHub release for this version
        id: release
        if: steps.base.outputs.skip != 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.osticket }}
        run: |
          gh release view "v${VERSION}" >/dev/null 2>&1 && exit 0
          gh release create "v${VERSION}" --target "${GITHUB_SHA}" --title "osTicket ${VERSION}" \
            --notes "osTicket ${VERSION} on PHP 8.3, built from the official osTicket release zip.

          \`\`\`bash
          docker pull ghcr.io/${GITHUB_REPOSITORY_OWNER}/osticket:${VERSION}
          \`\`\`

          See the README for configuration."
          echo "created=true" >> "$GITHUB_OUTPUT"

      # A new osTicket version needs the image tag in Easypanel's template
      # bumped. Needs a classic personal access token with the public_repo
      # scope saved as the TEMPLATES_PR_TOKEN secret; skipped without it.
      - name: Open the Easypanel template PR
        if: steps.release.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ secrets.TEMPLATES_PR_TOKEN }}
          VERSION: ${{ steps.version.outputs.osticket }}
          OWNER: ${{ github.repository_owner }}
        run: .github/scripts/open-easypanel-pr.sh
