name: Publish image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - docker/**
      - .github/workflows/publish.yml
  pull_request:
  # Weekly rebuild picks up security fixes in the php:8.3-apache base image.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read osTicket version from Dockerfile
        id: version
        run: |
          version=$(sed -n 's/^ARG OSTICKET_VERSION=//p' Dockerfile)
          test -n "$version"
          echo "osticket=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/osticket
          tags: |
            type=raw,value=${{ steps.version.outputs.osticket }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=osTicket
            org.opencontainers.image.version=${{ steps.version.outputs.osticket }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
